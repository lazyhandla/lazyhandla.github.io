<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyHand</title>
<meta name="description" content="LazyHand automates the work your team repeats every day. Built and used daily by a real LA business. Free consultation.">
<meta property="og:title" content="LazyHand — Automate the work your team repeats every day">
<meta property="og:description" content="Invoices, inventory, reports, line sheets, auto-printing and custom automation. Free consultation.">

<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#16181d; --muted:#5d6370; --line:#e3e1da;
  --accent:#1f5eff; --accent-ink:#ffffff; --soft:#eaf0ff; --ok:#137a3f; --err:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --card:#1b1d23; --ink:#eef0f4; --muted:#a3a9b6; --line:#2c2f37;
    --accent:#5b8cff; --accent-ink:#0b0d12; --soft:#1e2740; --ok:#4cc38a; --err:#ff7a6b;
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --card:#1b1d23; --ink:#eef0f4; --muted:#a3a9b6; --line:#2c2f37;
  --accent:#5b8cff; --accent-ink:#0b0d12; --soft:#1e2740; --ok:#4cc38a; --err:#ff7a6b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="ko"] body{font-family:"Noto Sans KR",Inter,system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:18px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{width:auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:6px 14px;cursor:pointer;border-radius:0}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
header{padding:32px 0 28px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:4px 12px;border-radius:999px;margin-bottom:16px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.2;font-weight:900;margin:0 0 16px;letter-spacing:-.025em}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:620px}
.cta{display:inline-block;margin-top:24px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 24px;border-radius:12px;text-decoration:none}
section{padding:24px 0}
h2{font-size:22px;margin:0 0 16px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.item b{display:block;font-size:16px;margin-bottom:4px}
.item span{color:var(--muted);font-size:14px}
.item.custom{border-style:dashed;border-color:var(--accent);background:var(--soft)}
.trust{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.trust ul{margin:0;padding-left:20px}
.trust li{margin:6px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;margin-bottom:8px}
.step b{display:block}
.step span{color:var(--muted);font-size:14px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
@media (max-width:560px){form{padding:18px}}
fieldset{border:0;padding:0;margin:0 0 24px;min-width:0}
legend{font-weight:700;font-size:16px;margin-bottom:10px;padding:0}
label.f{display:block;font-size:14px;font-weight:500;margin:12px 0 6px}
.req{color:var(--err)}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:0}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px}
.checks input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.checks label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.submit{width:100%;font:inherit;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:16px;cursor:pointer}
.submit:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-weight:500;display:none}
.msg.ok{display:block;color:var(--ok)}
.msg.err{display:block;color:var(--err)}
.hp{position:absolute;left:-9999px}
footer{padding:32px 0 48px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:inherit}
</style>
</head>

        <legend data-i="l1"></legend>

        <div class="row">

          <div><label class="f" for="size" data-i="size"></label>

        </div>

        <div class="checks" data-checks="needs" data-name="Needs"></div>
      </fieldset>

      <fieldset>
        <legend data-i="l3"></legend>
        <div class="checks" data-checks="tools" data-name="Software used"></div>
      </fieldset>

      <fieldset>

          <div><label class="f" for="contact" data-i="contact"></label>

        </div>

      <button class="submit" id="btn" type="submit" data-i="submit"></button>
      <p id="msg" class="msg" role="status"></p>
    </form>
  </section>

  <footer>© LazyHand · <a id="mail" href="#"></a></footer>
</div>

    contactOpts: [['Phone', '전화'], ['Text', '문자'], ['Email', '이메일'], ['KakaoTalk', '카카오톡']],
    submit: '무료 상담 신청하기',
    sending: '보내는 중…',
    required: '회사명, 담당자 성함, 전화번호는 꼭 적어주세요.',
    ok: '신청이 접수되었습니다. 영업일 1일 안에 연락드리겠습니다. 감사합니다!',
    fail: '전송에 실패했습니다. ' + CONTACT_EMAIL + ' 으로 직접 연락 부탁드립니다.',
  }
};

let lang = 'en';

function buildChecks(el, list) {
  const keep = new Set([...el.querySelectorAll('input:checked')].map(i => i.value));
  const name = el.dataset.name;
  el.innerHTML = '';
  for (const [value, ko, en] of list) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox'; input.name = name; input.value = value; input.checked = keep.has(value);
    label.append(input, document.createTextNode(lang === 'ko' ? ko : en));
    el.append(label);
  }
}

function buildSelect(el, opts) {
  const keep = el.value;
  el.innerHTML = '';
  for (const [value, text] of opts) {
    const o = document.createElement('option'); o.value = value; o.textContent = text; el.append(o);
  }
  el.value = keep;
  if (el.selectedIndex < 0) el.selectedIndex = 0;
}

function setLang(next) {
  lang = next;
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t[el.dataset.i]; });
  document.querySelectorAll('[data-opts]').forEach(el => buildSelect(el, t[el.dataset.opts]));
  document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t[el.dataset.ph]; });
  buildChecks(document.querySelector('[data-checks="needs"]'), NEEDS);
  buildChecks(document.querySelector('[data-checks="tools"]'), TOOLS);
  document.querySelectorAll('[data-set-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)));
  document.getElementById('msg').className = 'msg';
  try { localStorage.setItem('lh-lang', lang); } catch (e) {}
}

document.querySelectorAll('[data-set-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.setLang)));

const mail = document.getElementById('mail');
mail.textContent = CONTACT_EMAIL; mail.href = 'mailto:' + CONTACT_EMAIL;

let initial = (new URLSearchParams(location.search).get('lang')) || '';
if (!initial) { try { initial = localStorage.getItem('lh-lang') || ''; } catch (e) {} }
if (!T[initial]) initial = (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
setLang(initial);

const f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = T[lang];
  msg.className = 'msg';
  for (const id of ['company', 'name', 'phone']) {
    const el = document.getElementById(id);
    if (!el.value.trim()) { msg.textContent = t.required; msg.className = 'msg err'; el.focus(); return; }
  }
  const fd = new FormData(f);
  if (fd.get('_honey')) return;
  const data = {};
  for (const [k, v] of fd.entries()) {
    if (k === '_honey' || v === '') continue;
    data[k] = data[k] ? data[k] + ', ' + v : v;
  }
  data['Language'] = lang === 'ko' ? 'Korean' : 'English';
  data._subject = '[LazyHand lead] ' + data['Company'] + ' / ' + data['Name'];
  data._template = 'table';
  data._captcha = 'false';
  btn.disabled = true; btn.textContent = t.sending;
  try {
    const r = await fetch(FORM_ENDPOINT, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(data)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || String(j.success) === 'false') throw new Error(j.message || r.status);
    f.reset();
    msg.textContent = t.ok; msg.className = 'msg ok';
  } catch (err) {
    msg.textContent = t.fail; msg.className = 'msg err';
  } finally {
    btn.disabled = false; btn.textContent = t.submit;
  }
});
</script>
</body>
</html>
